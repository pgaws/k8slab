apiVersion: v1
kind: Service

metadata:
  name: redis-service
  namespace: {{ .Values.pythonApp.namespace }}

spec:
  type: {{ .Values.redis.service.type }}

  selector:
    app: redis-app

  ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.targetPort }}